[project]
name = "cropsense"
version = "2.1.0"
description = "IoT Agricultural Soil Telemetry & Irrigation Optimization Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
